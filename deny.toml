# What the resolved dependency graph is allowed to be. Runs on `cargo deny check`.

[graph]
# Dev-dependencies are dependencies: the rules see the whole graph.
exclude-dev = false

[licenses]
# The crate ships MIT OR Apache-2.0; anything that cannot travel under both refuses.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
]

[bans]
# Two versions of one crate is two definitions of one type.
multiple-versions = "deny"
# A `*` requirement is a decision deferred to whoever resolves next.
wildcards = "deny"
# A path dependency is resolved by the path; it carries no version to be wild about.
allow-wildcard-paths = true

# The digest: the empty set is the strictest posture and holds until the
# manifest pass. It is superseded there by the per-realization qualification
# rows (depot/core.md, blake3-realization-* and blake3-feature-reconciliation):
# each realization profile declares its exact feature row against
# default-features = false, and this flat set is replaced, not widened.
[[bans.features]]
crate = "blake3"
allow = []
exact = true

[sources]
# One registry, no git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
